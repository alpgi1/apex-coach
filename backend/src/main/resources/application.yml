spring:
  application:
    name: apex-coach-api
  profiles:
    active: dev

  # ── JPA / Hibernate ────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # ── Flyway ─────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── OAuth2 Resource Server (Supabase JWT) ──────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://fiafmmecijtjxifbgweb.supabase.co/auth/v1/.well-known/jwks.json

  # ── Jackson ────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null

# ── Server ─────────────────────────────────────────────
server:
  port: 8080

# ── Logging ────────────────────────────────────────────
logging:
  level:
    com.apexcoach: DEBUG
    org.hibernate.SQL: DEBUG
