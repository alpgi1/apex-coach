spring:
  # ── Production DB (Supabase PostgreSQL via Supavisor pooler) ──
  # Credentials embedded in URL — user/pass NOT set separately
  # to avoid HikariCP overriding the URL-embedded username (postgres.PROJECT_REF)
  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    show-sql: false

  # ── Flyway ─────────────────────────────────────────────
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

# ── CORS (production) ───────────────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://apex-coach.onrender.com}

logging:
  level:
    com.apexcoach: INFO
    org.hibernate.SQL: WARN
