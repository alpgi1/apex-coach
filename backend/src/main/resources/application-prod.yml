spring:
  # ── Production DB (Supabase PostgreSQL) ────────────────
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    show-sql: false

  # ── Flyway ─────────────────────────────────────────────
  flyway:
    baseline-on-migrate: false

# ── CORS (production) ───────────────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://apex-coach.onrender.com}

logging:
  level:
    com.apexcoach: INFO
    org.hibernate.SQL: WARN
