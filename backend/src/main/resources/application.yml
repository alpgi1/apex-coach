spring:
  application:
    name: apex-coach-api

  # ── JPA / Hibernate ────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # ── Flyway ─────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Jackson ────────────────────────────────────────────
  jackson:
    default-property-inclusion: non_null

# ── Server ─────────────────────────────────────────────
server:
  port: 8080

# ── Logging ────────────────────────────────────────────
logging:
  level:
    com.apexcoach: DEBUG
    org.hibernate.SQL: DEBUG
