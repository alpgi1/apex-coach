services:
  postgres:
    image: postgres:17-alpine
    container_name: apexcoach-db
    environment:
      POSTGRES_DB: apexcoach
      POSTGRES_USER: apexcoach
      POSTGRES_PASSWORD: apexcoach_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apexcoach"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: apexcoach-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@apexcoach.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
